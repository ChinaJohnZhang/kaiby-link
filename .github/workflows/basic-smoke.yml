name: Verify basic portable packages
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v0.1.0-preview.1
permissions:
  contents: read
jobs:
  installed-service:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract, start, reuse and exit the downloaded basic package
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/basic-smoke.cjs
